name: Docker GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "wiki/**"
      - "screenshots/**"
      - "site/**"
      - ".changes/**"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-ghcr.yml"
      - "docker-compose.yml"
      - "docker-stack.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag extra opcional (ex: edge, custom-v1)"
        required: false
        default: ""
      platforms:
        description: "Plataformas alvo para build multi-arch"
        required: false
        default: "linux/amd64,linux/arm64"
      push:
        description: "Publicar imagem no GHCR"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prep.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION 2>/dev/null || echo 'dev')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          EXTRA_TAGS=""
          if [ -n "${{ inputs.tag }}" ]; then
            EXTRA_TAGS="type=raw,value=${{ inputs.tag }}"
          fi
          echo "extra_tags=${EXTRA_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            ${{ steps.prep.outputs.extra_tags }}
          labels: |
            org.opencontainers.image.title=9router-go
            org.opencontainers.image.description=High-performance native Go AI API proxy gateway with token saver features
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms || (github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64') }}
          push: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}
          load: ${{ github.event_name == 'pull_request' || inputs.push == false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
          provenance: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,mode=max,scope=ghcr

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### GHCR Docker Build"
            echo ""
            echo "- **Image:** \`${{ steps.prep.outputs.image }}\`"
            echo "- **Version:** \`${{ steps.prep.outputs.version }}\`"
            echo "- **Push:** \`${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}\`"
            if [ -n "${{ steps.build.outputs.digest }}" ]; then
              echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            fi
            echo ""
            echo "#### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
