name: Docker GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "wiki/**"
      - "screenshots/**"
      - "site/**"
      - ".changes/**"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-ghcr.yml"
      - "docker-compose.yml"
      - "docker-stack.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag extra opcional (ex: edge, custom-v1)"
        required: false
        default: ""
      push:
        description: "Publicar imagem no GHCR"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  # Native multi-arch matrix (amd64 + arm64) without QEMU emulation.
  # Each runner builds its native architecture in parallel and pushes by digest;
  # the `merge` job below combines them into one multi-arch manifest list.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_slug: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION 2>/dev/null || echo 'dev')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}
          load: ${{ github.event_name == 'pull_request' || inputs.push == false }}
          tags: ${{ steps.prep.outputs.image }}:build-${{ matrix.arch_slug }}-${{ github.run_id }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ghcr-${{ matrix.arch_slug }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch_slug }}

      - name: Export digest
        if: github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true)
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true)
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION 2>/dev/null || echo 'dev')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          EXTRA_TAGS=""
          if [ -n "${{ inputs.tag }}" ]; then
            EXTRA_TAGS="type=raw,value=${{ inputs.tag }}"
          fi
          echo "extra_tags=${EXTRA_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            ${{ steps.prep.outputs.extra_tags }}
          labels: |
            org.opencontainers.image.title=9router-go
            org.opencontainers.image.description=High-performance native Go AI API proxy gateway with token saver features
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ steps.prep.outputs.image }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=("-t" "$tag")
          done <<< "$TAGS"
          for digest in *; do
            [ -e "$digest" ] && args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect manifest & write summary
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          {
            echo "### GHCR Multi-Arch Image Published"
            echo ""
            echo "- **Image:** \`${{ steps.prep.outputs.image }}\`"
            echo "- **Version:** \`${{ steps.prep.outputs.version }}\`"
            echo "- **Platforms:** \`linux/amd64, linux/arm64\` (native runners, no QEMU)"
            echo ""
            echo "#### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "#### Manifest"
            echo '```'
            docker buildx imagetools inspect "$FIRST_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
